<!doctype html>
<html lang="en">
  <head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <div class="container">
      <div>
        <h1>Life on the Grid</h1>
        <p><em>Projects by Alaura Ward</em></p>
        <p><em>Things I've built, things I'm building, and things I'm still figuring out.</em></p>
      </div>
    </div>
    <script>
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>
    <footer>
        <p> &copy; 2026 Alaura Ward </p>
    </footer>
  </body>
</html>
